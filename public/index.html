 <!DOCTYPE html>
<html lang="en">
<head>

  <style>
    /* Root min height */
    #root {
      min-height: 100vh;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0c1c; }
    ::-webkit-scrollbar-thumb {
      background: #4c1d95;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5b21b6;
    }

    /* Smooth fade animations for React components */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-in-out; }
  </style>
